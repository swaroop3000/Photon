<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photon — DNA design + version control</title>
<style>
:root{--bg:#f6f7f6;--panel:#fff;--ink:#151a19;--muted:#697470;--line:#e4e7e5;--line2:#cdd3d0;--accent:#0f8f79;--aw:rgba(15,143,121,.1);--aink:#0b6d5d;--bd:#eef1ef;
--promoter:#3b82f6;--cds:#16a34a;--terminator:#ef4444;--origin:#a855f7;--resistance:#f59e0b;--tag:#14b8a6;--primer:#ec4899;--misc:#64748b;--site:#0ea5e9;
--shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--r:11px;}
@media(prefers-color-scheme:dark){:root{--bg:#0d100f;--panel:#151918;--ink:#e7ebe9;--muted:#8b958f;--line:#232927;--line2:#333b38;--accent:#2bb89e;--aw:rgba(43,184,158,.14);--aink:#5fd7c0;--bd:#0a0d0c;--shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.45);}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.logo{font-size:18px;font-weight:700;letter-spacing:-.02em}.logo b{color:var(--accent)}.spacer{flex:1}
.btn{border:1px solid var(--line2);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.12s}
.btn:hover{border-color:var(--accent);color:var(--aink)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{filter:brightness(1.05);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}.btn.danger:hover{border-color:var(--terminator);color:var(--terminator)}
.dd{position:relative}.ddp{position:absolute;top:calc(100% + 5px);left:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:230px;z-index:40;display:none;max-height:380px;overflow:auto}
.ddp.right{left:auto;right:0}.ddp.open{display:block}.ddp button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:8px 10px;border-radius:7px;font-size:13px}
.ddp button:hover{background:var(--aw);color:var(--aink)}.ddp hr{border:none;border-top:1px solid var(--line);margin:5px 0}.ddhead{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
.nav{display:flex;gap:2px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.navt{padding:12px 13px;font-size:13px;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;white-space:nowrap}
.navt.active{color:var(--ink);border-bottom-color:var(--accent)}.navt .cnt{font-family:var(--mono);font-size:11px;background:var(--bd);border-radius:999px;padding:1px 7px;margin-left:5px}
.body{flex:1;overflow:auto;min-height:0}.dirty{font-size:11px;color:var(--resistance);font-family:var(--mono)}.lock{font-size:11px;color:var(--muted);font-family:var(--mono)}
.code{display:grid;grid-template-columns:1fr 400px;height:100%;min-height:0}.cl{overflow-y:auto;padding:16px}.cr{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:14px 16px;margin-bottom:14px}.meta .title input{font:inherit;font-size:16px;font-weight:600;background:none;border:none;border-bottom:1px dashed transparent;outline:none;color:var(--ink)}.meta .title input:hover,.meta .title input:focus{border-bottom-color:var(--line2)}
.st{display:flex;flex-direction:column}.st .v{font-family:var(--mono);font-size:15px}.st .l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--aw);color:var(--aink);font-family:var(--mono)}
.mapwrap{padding:10px;position:relative;margin-bottom:14px}.maptabs{display:flex;gap:4px;position:absolute;top:14px;left:14px;z-index:5}.maptab{font-size:12px;padding:5px 11px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--muted)}.maptab.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#mapView{width:100%;display:block}#mapView text{font-family:var(--sans);fill:var(--ink)}.arc{cursor:pointer}.arc:hover{opacity:.75}
.legend{display:flex;flex-wrap:wrap;gap:7px 13px;font-size:11px;color:var(--muted);margin-top:10px}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:3px}
.seqcard{padding:14px 16px}.seccap,.cr h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.seqview{font-family:var(--mono);font-size:12.5px;line-height:1.85;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow-y:auto}.seqview .num{color:var(--muted);user-select:none}.seqview .b{border-radius:2px}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}.tab{padding:11px 10px;font-size:12px;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;white-space:nowrap}.tab.active{color:var(--aink);border-bottom-color:var(--accent)}
.tabbody{flex:1;overflow-y:auto;padding:16px;min-height:0}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field label{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}textarea{font-family:var(--mono);font-size:12px;resize:vertical;min-height:90px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frow{display:flex;align-items:center;gap:9px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}.frow:hover{border-color:var(--line2)}.frow.sel{border-color:var(--accent);background:var(--aw)}
.fdot{width:11px;height:11px;border-radius:3px;flex:none}.fname{font-size:13px;flex:1}.floc{font-family:var(--mono);font-size:11px;color:var(--muted)}.fdel,.fup{border:none;background:none;color:var(--muted);font-size:14px;padding:0 3px}.fdel:hover{color:var(--terminator)}.fup:hover{color:var(--accent)}
.li{padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px}.li .mono{font-family:var(--mono);font-size:11.5px;color:var(--muted)}.mini{font-size:11px;color:var(--muted)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.echip{font-size:12px;font-family:var(--mono);padding:5px 9px;border-radius:7px;border:1px solid var(--line2);background:var(--bg);color:var(--muted)}.echip.on{background:var(--site);border-color:var(--site);color:#fff}
#gel{width:100%;background:var(--bd);border-radius:8px}#gel text{fill:var(--muted);font-family:var(--mono);font-size:9px}
.out{font-family:var(--mono);font-size:12px;word-break:break-all;line-height:1.7;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:220px;overflow:auto}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:22px 10px}
.page{max-width:940px;margin:0 auto;padding:20px}
.commit{display:flex;gap:11px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}.commit .bull{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}.commit .msg{font-size:14px}.commit .cmeta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}.commit .acts{margin-top:8px;display:flex;gap:7px;flex-wrap:wrap}.tagpill{font-family:var(--mono);font-size:10px;background:var(--aw);color:var(--aink);padding:2px 7px;border-radius:5px;margin-left:6px}
.diff{font-family:var(--mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px;margin-top:9px;white-space:pre-wrap;line-height:1.7}.diff .add{color:var(--cds)}.diff .rm{color:var(--terminator)}.diff .ctx{color:var(--muted)}
.branchrow,.prrow,.issuerow{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel);flex-wrap:wrap}.branchrow .bn{font-family:var(--mono);font-size:13px;flex:1}.tagd{font-size:11px;color:var(--muted)}
.badge{font-size:11px;padding:2px 9px;border-radius:999px;font-family:var(--mono)}.badge.open{background:rgba(22,163,74,.14);color:#16a34a}.badge.merged{background:rgba(168,85,247,.16);color:#a855f7}.badge.closed{background:rgba(239,68,68,.14);color:#ef4444}.badge.approved{background:rgba(22,163,74,.14);color:#16a34a}.badge.changes{background:rgba(245,158,11,.16);color:#b8860b}
.lblchip{font-size:10px;padding:2px 8px;border-radius:999px;font-family:var(--mono);background:var(--bd);color:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:7px;opacity:0;transition:.1s;z-index:80;font-family:var(--mono);white-space:nowrap}
h2.ph{font-size:18px;margin:0 0 12px;letter-spacing:-.01em}.sub{color:var(--muted);font-size:13px;margin:-6px 0 16px}
.readme{white-space:pre-wrap;font-size:14px;line-height:1.7}#graph{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.colorlab{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}.colorlab input[type=color]{width:34px;height:26px;padding:0;border:none;background:none}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:90}.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px;max-width:560px;width:92%;max-height:86vh;overflow:auto}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.pchip{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);cursor:pointer}.pchip:hover{border-color:var(--accent)}
.alnrow{font-family:var(--mono);font-size:12px;white-space:pre;overflow-x:auto;line-height:1.5}
.rev{padding:9px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px}
html[data-theme="light"]{--bg:#f6f7f6;--panel:#fff;--ink:#151a19;--muted:#697470;--line:#e4e7e5;--line2:#cdd3d0;--accent:#0f8f79;--aw:rgba(15,143,121,.1);--aink:#0b6d5d;--bd:#eef1ef;--shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06);}
html[data-theme="dark"]{--bg:#0d100f;--panel:#151918;--ink:#e7ebe9;--muted:#8b958f;--line:#232927;--line2:#333b38;--accent:#2bb89e;--aw:rgba(43,184,158,.14);--aink:#5fd7c0;--bd:#0a0d0c;--shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.45);}
body{transition:background .22s ease,color .22s ease}
.mono,.floc,.cmeta,.st .v,.seqview,.tagd,.alnrow{font-variant-numeric:tabular-nums}
@media(max-width:760px){.ovgrid{grid-template-columns:1fr!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="logo">Pho<b>ton</b></span>
    <div class="dd"><button class="btn" id="repoBtn">📁 <span id="repoName">repo</span> ▾</button><div class="ddp" id="repoDD"></div></div>
    <div class="dd"><button class="btn" id="branchBtn">⑂ <span id="branchName">main</span> ▾</button><div class="ddp" id="branchDD"></div></div>
    <span class="dirty" id="dirty"></span><span class="lock" id="lock"></span>
    <div class="spacer"></div>
    <input id="globalSearch" placeholder="Search commits & issues…" style="width:190px" oninput="doSearch(this.value)">
    <button class="btn sm" id="btnReset">Reset demo</button>
    <label class="btn sm" for="fileIn">Import</label>
    <input type="file" id="fileIn" accept=".gb,.gbk,.fasta,.fa,.txt,.xml,.sbol,.json" style="display:none">
    <div class="dd"><button class="btn sm" id="expBtn">Export ▾</button><div class="ddp right" id="expDD"><button data-f="fasta">FASTA</button><button data-f="genbank">GenBank</button><button data-f="sbol">SBOL2</button><button data-f="native">Photon .json (repo bundle)</button></div></div>
    <button class="btn primary" id="btnCommit">Commit</button>
  </div>
  <div class="nav" id="nav"></div>
  <div class="body" id="view"></div>
</div>
<div class="tip" id="tip"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
/* ============================================================ ENGINE ============================================================ */
const CODON={TTT:'F',TTC:'F',TTA:'L',TTG:'L',CTT:'L',CTC:'L',CTA:'L',CTG:'L',ATT:'I',ATC:'I',ATA:'I',ATG:'M',GTT:'V',GTC:'V',GTA:'V',GTG:'V',TCT:'S',TCC:'S',TCA:'S',TCG:'S',CCT:'P',CCC:'P',CCA:'P',CCG:'P',ACT:'T',ACC:'T',ACA:'T',ACG:'T',GCT:'A',GCC:'A',GCA:'A',GCG:'A',TAT:'Y',TAC:'Y',TAA:'*',TAG:'*',CAT:'H',CAC:'H',CAA:'Q',CAG:'Q',AAT:'N',AAC:'N',AAA:'K',AAG:'K',GAT:'D',GAC:'D',GAA:'E',GAG:'E',TGT:'C',TGC:'C',TGA:'*',TGG:'W',CGT:'R',CGC:'R',CGA:'R',CGG:'R',AGT:'S',AGC:'S',AGA:'R',AGG:'R',GGT:'G',GGC:'G',GGA:'G',GGG:'G'};
const ECOLI={F:'TTC',L:'CTG',I:'ATC',M:'ATG',V:'GTG',S:'AGC',P:'CCG',T:'ACC',A:'GCG',Y:'TAC','*':'TAA',H:'CAC',Q:'CAG',N:'AAC',K:'AAA',D:'GAC',E:'GAA',C:'TGC',W:'TGG',R:'CGT',G:'GGC',X:'NNN'};
const ENZYMES=[["EcoRI","GAATTC",1],["BamHI","GGATCC",1],["HindIII","AAGCTT",1],["NotI","GCGGCCGC",2],["XhoI","CTCGAG",1],["XbaI","TCTAGA",1],["PstI","CTGCAG",5],["SalI","GTCGAC",1],["NcoI","CCATGG",1],["NdeI","CATATG",2],["KpnI","GGTACC",5],["SacI","GAGCTC",5],["SpeI","ACTAGT",1],["SmaI","CCCGGG",3],["EcoRV","GATATC",3],["BsaI","GGTCTC",1],["BsmBI","CGTCTC",1],["ClaI","ATCGAT",2],["MluI","ACGCGT",1],["NheI","GCTAGC",1],["AflII","CTTAAG",1],["ApaI","GGGCCC",5],["BglII","AGATCT",1],["DraI","TTTAAA",3],["HpaI","GTTAAC",3],["PvuII","CAGCTG",3],["ScaI","AGTACT",3],["StuI","AGGCCT",3]];
const FEATLIB=[["T7 promoter","TAATACGACTCACTATAG","promoter"],["T3 promoter","AATTAACCCTCACTAAAG","promoter"],["SP6 promoter","ATTTAGGTGACACTATAG","promoter"],["lac promoter","TTTACACTTTATGCTTCCGGCTCG","promoter"],["RBS (Shine-Dalgarno)","AGGAGG","misc"],["His-tag","CACCACCACCACCACCAC","tag"],["FLAG-tag","GATTACAAGGATGACGACGATAAG","tag"],["T7 terminator","CTAGCATAACCCCTTGGGGCCTCTAAACGGG","terminator"],["attB1","ACAAGTTTGTACAAAAAAGCAGGCT","misc"],["attB2","ACCCAGCTTTCTTGTACAAAGTGGT","misc"]];
const TYPES=["promoter","CDS","terminator","origin","resistance","tag","primer","misc"];
const PARTS=[["T7 promoter","TAATACGACTCACTATAGGG","promoter"],["lac promoter","TTGACAATTAATCATCGGCTCGTATAATG","promoter"],["RBS","AAAGAGGAGAAA","misc"],["ATG start","ATG","CDS"],["GFP (frag)","ATGAGTAAAGGAGAAGAACTTTTCACTGGAGTTGTCCCAATT","CDS"],["His6-tag","CACCACCACCACCACCAC","tag"],["FLAG-tag","GATTACAAGGATGACGACGATAAG","tag"],["Stop (TAA)","TAA","misc"],["T7 terminator","CTAGCATAACCCCTTGGGGCCTCTAAACGGGTCTTGAGG","terminator"],["MCS","GAATTCGGATCCAAGCTTCTCGAGTCTAGA","misc"],["ori (frag)","TTGAGATCCTTTTTTTCTGCGCGTAATCTGCTGCTTGC","origin"],["AmpR (frag)","ATGAGTATTCAACATTTCCGTGTCGCCCTTATTCCCTTT","resistance"]];
const COL=t=>getComputedStyle(document.documentElement).getPropertyValue('--'+(t==='CDS'?'cds':t)).trim()||'#64748b';
const clean=s=>(s||'').toUpperCase().replace(/[^ACGTN]/g,'');
const rc=s=>s.split('').reverse().map(c=>({A:'T',T:'A',G:'C',C:'G',N:'N'}[c]||'N')).join('');
const gc=s=>s.length?Math.round(([...s].filter(c=>c==='G'||c==='C').length/s.length)*1000)/10:0;
const translate=s=>{let p='';for(let i=0;i+3<=s.length;i+=3)p+=CODON[s.substr(i,3)]||'X';return p;};
const codonOptimize=s=>{let o='';for(let i=0;i+3<=s.length;i+=3){const aa=CODON[s.substr(i,3)]||'X';o+=ECOLI[aa]||s.substr(i,3);}return o+s.slice(Math.floor(s.length/3)*3);};
function findMotif(seq,m,circ){const res=[];if(!m)return res;const hay=circ?seq+seq.slice(0,m.length-1):seq;let i=hay.indexOf(m);while(i!==-1&&i<seq.length){res.push(i);i=hay.indexOf(m,i+1);}return res;}
function findORFs(seq,minAA){const out=[],L=seq.length;const scan=(str,strand)=>{for(let f=0;f<3;f++){let i=f;while(i+3<=str.length){if(str.substr(i,3)==='ATG'){let j=i,stop=-1;while(j+3<=str.length){const c=str.substr(j,3);if(c==='TAA'||c==='TAG'||c==='TGA'){stop=j+3;break;}j+=3;}if(stop!==-1){const aa=(stop-i)/3-1;if(aa>=minAA){if(strand===1)out.push({start:i+1,end:stop,strand:1,aa,protein:translate(str.substr(i,stop-i))});else out.push({start:L-stop+1,end:L-i,strand:-1,aa,protein:translate(str.substr(i,stop-i))});}i=stop;}else break;}else i+=3;}}};scan(seq,1);scan(rc(seq),-1);return out.sort((a,b)=>b.aa-a.aa).slice(0,15);}
function digest(seq,names,circ){const cuts=[];names.forEach(n=>{const e=ENZYMES.find(x=>x[0]===n);if(!e)return;findMotif(seq,e[1],circ).forEach(i=>cuts.push({pos:(i+e[2])%seq.length,enz:n}));const r=rc(e[1]);if(r!==e[1])findMotif(seq,r,circ).forEach(i=>cuts.push({pos:(i+e[1].length-e[2])%seq.length,enz:n}));});const u=[...new Map(cuts.map(c=>[c.pos,c])).values()].sort((a,b)=>a.pos-b.pos);const L=seq.length,fr=[];if(!u.length)fr.push(L);else if(circ){for(let i=0;i<u.length;i++)fr.push(((u[(i+1)%u.length].pos-u[i].pos+L)%L)||L);}else{let p=0;u.forEach(c=>{fr.push(c.pos-p);p=c.pos;});fr.push(L-p);}return{cuts:u,frags:fr.filter(f=>f>0).sort((a,b)=>b-a)};}
function tm(s){s=clean(s);if(!s.length)return 0;const at=[...s].filter(c=>c==='A'||c==='T').length,g=s.length-at;if(s.length<14)return 2*at+4*g;return Math.round((64.9+41*(g-16.4)/s.length)*10)/10;}
function designPrimers(seq,len){len=len||20;const f=seq.slice(0,len),r=rc(seq.slice(-len));return{f:{seq:f,tm:tm(f),gc:gc(f)},r:{seq:r,tm:tm(r),gc:gc(r)}};}
function virtualPCR(seq,fwd,rev,circ){fwd=clean(fwd);rev=clean(rev);const f=findMotif(seq,fwd,circ);const rr=rc(rev),r=findMotif(seq,rr,circ);if(!f.length||!r.length)return null;const start=f[0],end=r[0]+rr.length;let size=end-start;if(size<=0)size+=seq.length;return{start:start+1,end:(end%seq.length)||seq.length,size};}
function overlap(a,b){const mx=Math.min(a.length,b.length,80);for(let o=mx;o>=12;o--)if(a.slice(-o)===b.slice(0,o))return o;return 0;}
function gibson(frags){let f=frags.map(clean).filter(Boolean);if(f.length<2)return{ok:false,msg:'Need ≥2 fragments.'};let asm=f[0];const used=[true,...Array(f.length-1).fill(false)];for(let k=1;k<f.length;k++){let best=-1,bo=0;for(let i=0;i<f.length;i++){if(used[i])continue;const ov=overlap(asm,f[i]);if(ov>=15&&ov>bo){bo=ov;best=i;}}if(best===-1)return{ok:false,msg:'No ≥15 bp overlap found to continue.'};asm=asm+f[best].slice(bo);used[best]=true;}let hm=0;for(let o=Math.min(60,asm.length-1);o>=15;o--)if(asm.slice(-o)===asm.slice(0,o)){hm=o;break;}return{ok:true,seq:hm?asm.slice(0,asm.length-hm):asm,circular:!!hm,msg:`Gibson: assembled ${f.length} fragments${hm?' and circularized':''}.`};}
function goldenGate(frags){/* BsaI: excise insert incl 4nt overhangs, assemble by matching overhangs */let parts=[];frags.map(clean).filter(Boolean).forEach(f=>{const s=findMotif(f,'GGTCTC',false),sr=findMotif(f,'GAGACC',false);if(s.length&&sr.length){const a=s[0]+7,b=sr[sr.length-1]-1;if(b>a)parts.push(f.slice(a,b));else parts.push(f);}else parts.push(f);});if(parts.length<1)return{ok:false,msg:'No parts.'};/* assemble by 4nt overhang match */let asm=parts[0];for(let k=1;k<parts.length;k++){const oh=asm.slice(-4);const nx=parts[k];if(nx.slice(0,4)===oh)asm+=nx.slice(4);else asm+=nx;}return{ok:true,seq:asm,circular:true,msg:`Golden Gate: assembled ${parts.length} part(s) by 4-nt overhangs.`};}
function gateway(entry,dest){entry=clean(entry);dest=clean(dest);const b1=findMotif(entry,'ACAAGTTTGTACAAAAAAGCAGGCT',false),b2=findMotif(entry,'ACCCAGCTTTCTTGTACAAAGTGGT',false);if(!b1.length||!b2.length)return{ok:false,msg:'Entry sequence needs attB1 and attB2 sites (auto-annotate to check).'};const cassette=entry.slice(b1[0],b2[0]+25);const p1=findMotif(dest,'ACAAGTTTGTACAAAAAAGCAGGCT',false),p2=findMotif(dest,'ACCCAGCTTTCTTGTACAAAGTGGT',false);let seq;if(p1.length&&p2.length){seq=dest.slice(0,p1[0])+cassette+dest.slice(p2[0]+25);}else{seq=dest+cassette;}return{ok:true,seq,circular:true,msg:'Gateway LR: cassette recombined into destination (simplified att recombination).'};}
function needleman(a,b){/* pairwise global alignment, capped */a=clean(a).slice(0,1200);b=clean(b).slice(0,1200);const n=a.length,m=b.length,MATCH=1,MIS=-1,GAP=-1;const dp=Array.from({length:n+1},()=>new Float32Array(m+1));for(let i=0;i<=n;i++)dp[i][0]=i*GAP;for(let j=0;j<=m;j++)dp[0][j]=j*GAP;for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){const s=dp[i-1][j-1]+(a[i-1]===b[j-1]?MATCH:MIS);dp[i][j]=Math.max(s,dp[i-1][j]+GAP,dp[i][j-1]+GAP);}let i=n,j=m,A='',B='',mid='';while(i>0||j>0){if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+(a[i-1]===b[j-1]?MATCH:MIS)){A=a[i-1]+A;B=b[j-1]+B;mid=(a[i-1]===b[j-1]?'|':' ')+mid;i--;j--;}else if(i>0&&dp[i][j]===dp[i-1][j]+GAP){A=a[i-1]+A;B='-'+B;mid=' '+mid;i--;}else{A='-'+A;B=b[j-1]+B;mid=' '+mid;j--;}}const idn=[...mid].filter(c=>c==='|').length;return{A,B,mid,identity:A.length?Math.round(idn/A.length*1000)/10:0,score:dp[n][m]};}
/* parsers */
function parseFASTA(t){const l=t.split(/\r?\n/);let n='Imported',s='';for(const x of l){if(x.startsWith('>'))n=x.slice(1).trim().split(/\s+/)[0]||'Imported';else s+=x.trim();}return{name:n,seq:clean(s),features:[],topology:'linear'};}
function parseGenBank(t){const feats=[];let name='Imported',topo='linear',seq='';const m=t.match(/^LOCUS\s+(\S+)\s+\d+\s*bp([\s\S]*?)$/mi);if(m){name=m[1];if(/circular/i.test(m[0]))topo='circular';}const fs=t.split(/^FEATURES.*$/mi)[1];if(fs){const fb=fs.split(/^ORIGIN/mi)[0];const re=/^ {5}(\S+)\s+(complement\()?(?:join\()?[<>]?(\d+)\.\.[<>]?(\d+)/gm;let mm;while((mm=re.exec(fb))){const key=mm[1];if(key==='source')continue;const af=fb.slice(mm.index,mm.index+400);const lm=af.match(/\/(?:label|gene|product|note)="?([^"\n]+)"?/);feats.push({name:lm?lm[1].trim():key,start:+mm[3],end:+mm[4],strand:mm[2]?-1:1,type:gtype(key,lm?lm[1]:'')});}}const oi=t.search(/^ORIGIN/mi);if(oi!==-1)seq=t.slice(oi).replace(/^ORIGIN.*$/mi,'').replace(/[\d\s\/]/g,'');return{name,seq:clean(seq),features:feats,topology:topo};}
function parseSBOL(t){const seq=clean((t.match(/<sbol:sequence[^>]*>([^<]+)</i)||t.match(/<sbol:elements[^>]*>([^<]+)</i)||[])[1]||'');const name=(t.match(/<sbol:displayId>([^<]+)/i)||[])[1]||'SBOL import';const feats=[];const re=/<sbol:SequenceAnnotation>[\s\S]*?<sbol:name>([^<]+)<[\s\S]*?<sbol:start>(\d+)<[\s\S]*?<sbol:end>(\d+)</g;let m;while((m=re.exec(t)))feats.push({name:m[1],start:+m[2],end:+m[3],strand:/reverse/i.test(m[0])?-1:1,type:'misc'});return{name,seq,features:feats,topology:'linear'};}
function gtype(k,n){const s=(k+' '+(n||'')).toLowerCase();if(/prom/.test(s))return'promoter';if(/term/.test(s))return'terminator';if(/ori/.test(s))return'origin';if(/cds|gene/.test(s))return'CDS';if(/tag|his|flag/.test(s))return'tag';if(/amp|kan|bla|neo|resist/.test(s))return'resistance';if(/prim/.test(s))return'primer';return'misc';}
function detect(t){const h=t.trim();if(/<sbol/i.test(h))return parseSBOL(t);if(h.startsWith('>'))return parseFASTA(t);if(/LOCUS|ORIGIN/i.test(h))return parseGenBank(t);if(h.startsWith('{')){try{const j=JSON.parse(h);if(j.repo)return{_bundle:j.repo};if(j.sequence)return{name:j.name||'Import',seq:clean(j.sequence),features:j.features||[],topology:j.topology||'linear'};}catch(e){}}return{name:'Pasted',seq:clean(t),features:[],topology:'linear'};}

function toFASTA(w){return '>'+w.name+'\n'+(w.seq.match(/.{1,70}/g)||[]).join('\n')+'\n';}
function toGenBank(w){let o=`LOCUS       ${w.name.slice(0,16).padEnd(16)} ${w.seq.length} bp    DNA     ${w.topology}\nDEFINITION  Exported from Photon.\nFEATURES             Location/Qualifiers\n`;w.features.forEach(f=>{const loc=f.strand===-1?`complement(${f.start}..${f.end})`:`${f.start}..${f.end}`;o+=`     ${f.type.slice(0,15).padEnd(15)} ${loc}\n                     /label="${f.name}"\n`;});o+='ORIGIN\n';const s=w.seq.toLowerCase();for(let i=0;i<s.length;i+=60)o+=String(i+1).padStart(9)+' '+((s.substr(i,60).match(/.{1,10}/g)||[]).join(' '))+'\n';return o+'//\n';}
function toSBOL(w){let a='';w.features.forEach((f,i)=>{a+=`    <sbol:SequenceAnnotation><sbol:displayId>ann${i}</sbol:displayId><sbol:name>${f.name}</sbol:name><sbol:location><sbol:Range><sbol:start>${f.start}</sbol:start><sbol:end>${f.end}</sbol:end><sbol:orientation>${f.strand===-1?'reverseComplement':'inline'}</sbol:orientation></sbol:Range></sbol:location></sbol:SequenceAnnotation>\n`;});return `<?xml version="1.0"?>\n<sbol:SBOL xmlns:sbol="http://sbols.org/v2#">\n  <sbol:ComponentDefinition>\n    <sbol:displayId>${w.name}</sbol:displayId>\n    <sbol:type>DNA</sbol:type>\n${a}    <sbol:sequence>${w.seq}</sbol:sequence>\n  </sbol:ComponentDefinition>\n</sbol:SBOL>\n`;}
function download(n,t){const b=new Blob([t],{type:'text/plain'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u);}
function seqDiff(o,n){if(o===n)return null;let p=0;while(p<o.length&&p<n.length&&o[p]===n[p])p++;let s=0;while(s<o.length-p&&s<n.length-p&&o[o.length-1-s]===n[n.length-1-s])s++;return{pre:p,rm:o.slice(p,o.length-s),add:n.slice(p,n.length-s),sufStart:o.length-s};}

function migrate(r){r.pulls=r.pulls||[];r.issues=r.issues||[];r.tags=r.tags||[];r.wiki=r.wiki||[{title:'Home',body:'Welcome to the '+r.name+' wiki.'}];if(r.protected===undefined)r.protected=false;r.pulls.forEach(p=>{p.reviews=p.reviews||[];});r.issues.forEach(i=>{i.comments=i.comments||[];i.labels=i.labels||[];});}

const uid=()=>Math.random().toString(36).slice(2,9);
function snap(w){return{name:w.name,seq:w.seq,topology:w.topology,features:JSON.parse(JSON.stringify(w.features))};}
function seed(){const s=SAMPLE();autoAnn(s);annORFs(s);const rid=uid(),cid=uid();DB={repos:{},cur:rid,tab:'code'};DB.repos[rid]={id:rid,name:s.name,desc:'Demo plasmid.',stars:0,created:Date.now(),branch:'main',protected:false,branches:{main:{head:cid}},commits:{[cid]:{id:cid,parents:[],branch:'main',msg:'Initial import',author:'you',time:Date.now(),snap:snap(s)}},working:snap(s),tags:[],pulls:[],issues:[],wiki:[{title:'Home',body:'# '+s.name+'\n\nOpen, versioned DNA design. Edit → commit → branch → PR → merge.'}],readme:'# '+s.name+'\n\nAn open, versioned DNA design. Every change is tracked like Git.'};save();}
const repo=()=>DB.repos[DB.cur];const W=()=>repo().working;
const head=()=>{const r=repo();return r.commits[r.branches[r.branch].head];};
const isDirty=()=>{const h=head();return h?JSON.stringify(h.snap)!==JSON.stringify(W()):true;};
function ancestors(r,cid){const set=new Set(),stack=[cid];while(stack.length){const c=stack.pop();if(!c||set.has(c))continue;set.add(c);(r.commits[c].parents||[]).forEach(p=>stack.push(p));}return set;}
function commonAncestor(r,a,b){const A=ancestors(r,a);let best=null,bt=-1;const B=ancestors(r,b);B.forEach(c=>{if(A.has(c)&&r.commits[c].time>bt){bt=r.commits[c].time;best=c;}});return best;}
function mkCommit(r,msg,sn,parents,extra){const id=uid();r.commits[id]={id,parents:parents.filter(Boolean),branch:r.branch,msg,author:'you',time:Date.now(),snap:sn,...(extra||{})};r.branches[r.branch].head=id;return id;}
function commit(msg){const r=repo();if(r.protected&&r.branch==='main'){flash('main is protected — commit on another branch and open a PR.');return;}if(!isDirty()){flash('Nothing to commit.');return;}mkCommit(r,msg||'Update',snap(r.working),[r.branches[r.branch].head]);save();flash('Committed: '+(msg||'Update'));render();}
function createBranch(name){const r=repo();if(!name||r.branches[name]){flash('Invalid/existing branch.');return;}r.branches[name]={head:r.branches[r.branch].head};r.branch=name;save();flash('On new branch '+name);render();}
function switchBranch(name){const r=repo();if(isDirty()&&!confirm('Discard uncommitted changes and switch?'))return;r.branch=name;r.working=snap(r.commits[r.branches[name].head].snap);save();render();}
function amendCommit(){const r=repo();const h=head();if(!h){flash('Nothing to amend.');return;}const m=prompt('Amend commit message:',h.msg);if(m===null)return;h.msg=m;h.snap=snap(r.working);h.time=Date.now();save();flash('Amended last commit.');render();}
function revertTo(cid){const r=repo();if(!confirm('Create a new commit reverting to this state?'))return;mkCommit(r,'Revert to '+cid.slice(0,6),snap(r.commits[cid].snap),[r.branches[r.branch].head]);r.working=snap(r.commits[cid].snap);save();flash('Reverted.');DB.tab='code';render();}
function cherryPick(cid){const r=repo();mkCommit(r,'Cherry-pick '+cid.slice(0,6)+': '+r.commits[cid].msg,snap(r.commits[cid].snap),[r.branches[r.branch].head]);r.working=snap(r.commits[cid].snap);save();flash('Cherry-picked onto '+r.branch);DB.tab='code';render();}
function mergeBranch(src,squash){const r=repo();if(src===r.branch){flash('Pick a different branch.');return;}const oursH=r.branches[r.branch].head,theirsH=r.branches[src].head;if(oursH===theirsH){flash('Already up to date.');return;}const base=commonAncestor(r,oursH,theirsH);const ours=r.commits[oursH].snap,theirs=r.commits[theirsH].snap,baseS=base?r.commits[base].snap:{seq:'',features:[]};

  if(ours.seq===baseS.seq){finalize(theirs.seq);return;}
  if(theirs.seq===baseS.seq){finalize(ours.seq);return;}
  // conflict
  openConflict(src,ours,theirs,finalize);
}
function mergeFeatures(a,b){const out=[...a];b.forEach(f=>{if(!out.some(x=>x.name===f.name&&x.start===f.start))out.push(f);});return JSON.parse(JSON.stringify(out));}
function openPR(title,from,to,desc){const r=repo();r.pulls.unshift({id:uid(),title:title||`Merge ${from} into ${to}`,from,to,desc:desc||'',status:'open',created:Date.now(),reviews:[]});save();flash('PR opened.');render();}
function reviewPR(id,state,text){const r=repo();const pr=r.pulls.find(p=>p.id===id);if(!pr)return;pr.reviews.push({who:'you',state,text:text||'',time:Date.now()});save();render();}
function mergePR(id,squash){const r=repo();const pr=r.pulls.find(p=>p.id===id);if(!pr||pr.status!=='open')return;const prev=r.branch;r.branch=pr.to;const oursH=r.branches[pr.to].head,theirsH=r.branches[pr.from].head;const base=commonAncestor(r,oursH,theirsH);const ours=r.commits[oursH].snap,theirs=r.commits[theirsH].snap,baseS=base?r.commits[base].snap:{seq:'',features:[]};const done=(chosen)=>{const sn={name:ours.name,topology:theirs.topology,seq:chosen,features:mergeFeatures(ours.features,theirs.features)};if(squash)mkCommit(r,`Squash merge PR: ${pr.title}`,sn,[oursH]);else mkCommit(r,`Merge PR: ${pr.title}`,sn,[oursH,theirsH],{merge:true});if(r.branch===prev)r.working=snap(sn);r.branch=prev;pr.status='merged';save();flash('PR merged.');render();};if(ours.seq===theirs.seq||theirs.seq===baseS.seq)done(theirs.seq!==baseS.seq?theirs.seq:ours.seq);else if(ours.seq===baseS.seq)done(theirs.seq);else{r.branch=prev;openConflict(pr.from,ours,theirs,(chosen)=>{const p2=r.branch;r.branch=pr.to;const sn={name:ours.name,topology:theirs.topology,seq:chosen,features:mergeFeatures(ours.features,theirs.features)};if(squash)mkCommit(r,`Squash merge PR: ${pr.title}`,sn,[oursH]);else mkCommit(r,`Merge PR: ${pr.title}`,sn,[oursH,theirsH],{merge:true});r.branch=p2;pr.status='merged';save();flash('PR merged (conflict resolved).');render();});}}

function newRepo(){const name=prompt('New repository name:');if(!name)return;const s={name,seq:'',topology:'linear',features:[]};const rid=uid(),cid=uid();DB.repos[rid]={id:rid,name,desc:'',stars:0,created:Date.now(),branch:'main',protected:false,branches:{main:{head:cid}},commits:{[cid]:{id:cid,parents:[],branch:'main',msg:'Create repository',author:'you',time:Date.now(),snap:snap(s)}},working:snap(s),tags:[],pulls:[],issues:[],wiki:[{title:'Home',body:'# '+name}],readme:'# '+name};DB.cur=rid;DB.tab='code';save();render();}

function blame(){const r=repo();const chain=[];let c=r.branches[r.branch].head;while(c){chain.unshift(r.commits[c]);c=(r.commits[c].parents||[])[0];}const seq=W().seq;const owner=new Array(seq.length).fill(chain[0]?chain[0].id:null);for(let k=1;k<chain.length;k++){const d=seqDiff(chain[k-1].snap.seq,chain[k].snap.seq);if(d){for(let i=d.pre;i<d.pre+d.add.length&&i<owner.length;i++)owner[i]=chain[k].id;}}

  const segs=[];let s=0;for(let i=1;i<=owner.length;i++){if(i===owner.length||owner[i]!==owner[s]){segs.push({start:s,end:i-1,cid:owner[s]});s=i;}}return{segs,chain};}

   <button class="btn" id="cOurs">Keep ours</button>

function polar(cx,cy,r,d){const a=(d-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function sector(cx,cy,ri,ro,a0,a1){if(a1-a0<0.5)a1=a0+0.5;const lg=(a1-a0)>180?1:0;const[xo0,yo0]=polar(cx,cy,ro,a0),[xo1,yo1]=polar(cx,cy,ro,a1),[xi1,yi1]=polar(cx,cy,ri,a1),[xi0,yi0]=polar(cx,cy,ri,a0);return`M${xo0} ${yo0} A${ro} ${ro} 0 ${lg} 1 ${xo1} ${yo1} L${xi1} ${yi1} A${ri} ${ri} 0 ${lg} 0 ${xi0} ${yi0} Z`;}

.onmousemove=e=>{const f=W().features[+el.dataset.f];showTip(e,`${f.name} ${f.start}..${f.end} ${f.strand===-1?'←':'→'}`);};el.onmouseleave=hideTip;});const used=[...new Set(w.features.map(f=>f.type))],lg=document.getElementById('legend');if(lg)lg.innerHTML=used.map(t=>`<span><i style="background:${COL(t)}"></i>${t}</span>`).join('');}
function renderSeqView(){const w=W(),el=document.getElementById('sv');if(!el)return;const CAP=6000,seq=w.seq.slice(0,CAP),color=Array(seq.length).fill(null);w.features.forEach(f=>{for(let i=f.start-1;i<f.end&&i<seq.length;i++)color[i]=COL(f.type);});let h='';for(let i=0;i<seq.length;i+=60){h+=`<span class="num">${String(i+1).padStart(6)}  </span>`;for(let j=i;j<Math.min(i+60,seq.length);j++){const c=color[j];h+=c?`<span class="b" style="background:${c}33;color:${c}">${seq[j]}</span>`:seq[j];}h+='\n';}el.innerHTML=h||'<span class="num">(empty)</span>';const n=document.getElementById('snote');if(n)n.textContent=w.seq.length>CAP?`Showing first ${CAP} of ${w.seq.length} bp.`:'';}

function tAnalyze(b,w){b.innerHTML=`<h3>Open reading frames</h3><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><label class="mini">Min aa</label><input id="om" type="number" value="40" style="width:70px"><button class="btn sm" id="of">Find</button></div><div id="ol"></div>

const AAW={A:89,R:174,N:132,D:133,C:121,E:147,Q:146,G:75,H:155,I:131,L:131,K:146,M:149,F:165,P:115,S:105,T:119,W:204,Y:181,V:117};
function proteinStats(p){p=p.replace(/\*+$/,'');let mw=18;for(const c of p)mw+=(AAW[c]||110)-18;const pos=(p.match(/[RK]/g)||[]).length,neg=(p.match(/[DE]/g)||[]).length;const pI=neg>pos?4.8+(pos/(neg||1))*1.8:7.0+(pos-neg)*0.5;return{len:p.length,mw:Math.round(mw),charge:pos-neg,pI:Math.round(pI*10)/10};}
function uniqueCutters(seq,circ){return ENZYMES.map(e=>({enz:e[0],n:findMotif(seq,e[1],circ).length})).filter(x=>x.n===1);}
function msaAlign(seqs){seqs=seqs.map(clean).filter(Boolean);if(seqs.length<2)return null;let ref=seqs.reduce((a,b)=>a.length>=b.length?a:b);return{ref,rows:seqs.map(s=>needleman(ref,s).B)};}
function resolveVars(str){return str.replace(/var\((--[a-z0-9-]+)\)/gi,(m,v)=>getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#000');}
function exportSVG(){const sv=document.getElementById('mapView');if(!sv)return;download(W().name+'-map.svg','<?xml version="1.0"?>\n'+resolveVars(new XMLSerializer().serializeToString(sv)));}
function exportPNG(){const sv=document.getElementById('mapView');if(!sv)return;const xml=resolveVars(new XMLSerializer().serializeToString(sv));const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1240;c.height=900;const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=W().name+'-map.png';a.click();URL.revokeObjectURL(u);});};img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(xml)));}
function editFeatureModal(i){const w=W(),f=w.features[i];if(!f)return;modal(`<h2 class="ph">Edit feature</h2><div class="field"><label>Name</label><input id="efn" value="${esc(f.name)}"></div><div class="row2"><div class="field"><label>Start</label><input id="efs" type="number" value="${f.start}"></div><div class="field"><label>End</label><input id="efe" type="number" value="${f.end}"></div></div><div class="row2"><div class="field"><label>Type</label><select id="eft">${TYPES.map(t=>`<option ${t===f.type?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Strand</label><select id="efst"><option value="1" ${f.strand===1?'selected':''}>Forward →</option><option value="-1" ${f.strand===-1?'selected':''}>Reverse ←</option></select></div></div><div style="display:flex;gap:8px"><button class="btn primary" id="efv">Save</button><button class="btn" onclick="closeModal()">Cancel</button></div>`);document.getElementById('efv').onclick=()=>{f.name=document.getElementById('efn').value||f.name;f.start=+document.getElementById('efs').value||f.start;f.end=Math.min(+document.getElementById('efe').value||f.end,w.seq.length);f.type=document.getElementById('eft').value;f.strand=+document.getElementById('efst').value;closeModal();save();render();};}

  const se=document.getElementById('se');if(se&&!document.getElementById('edTools')){const bar=document.createElement('div');bar.id='edTools';bar.style.cssText='display:flex;gap:6px;margin-top:8px;align-items:center';bar.innerHTML='<input id="fq" placeholder="find motif…" style="flex:1"><button class="btn sm" id="fb">Find</button><button class="btn sm" id="ub">Undo</button><button class="btn sm" id="rb">Redo</button>';se.parentNode.appendChild(bar);
   document.getElementById('fb').onclick=()=>{const q=clean(document.getElementById('fq').value);const p=q?findMotif(W().seq,q,W().topology==='circular'):[];flash(p.length?`${p.length} match(es): ${p.slice(0,8).map(x=>x+1).join(', ')}${p.length>8?'…':''}`:'no matches');};
   document.getElementById('ub').onclick=()=>{if(!(U.past&&U.past.length)){flash('Nothing to undo');return;}U.future=U.future||[];U.future.push(W().seq);W().seq=U.past.pop();save();render();flash('Undid');};

   const ap=document.getElementById('ap');if(ap){const c=ap.cloneNode(true);ap.parentNode.replaceChild(c,ap);c.onclick=()=>{U.past=U.past||[];U.past.push(W().seq);U.future=[];const nw=clean(document.getElementById('se').value),w=W();w.seq=nw;w.features=w.features.filter(f=>f.start<=nw.length).map(f=>({...f,end:Math.min(f.end,nw.length)}));U.sel=-1;save();flash('Applied (undoable)');render();};}}}
function augmentTool(){const tb=document.getElementById('tb');if(!tb)return;if(U.tool==='features'){if(U.sel>=0&&!document.getElementById('editSel')){const b=document.createElement('button');b.id='editSel';b.className='btn sm';b.textContent='✎ Edit selected feature';b.style.marginBottom='10px';tb.insertBefore(b,tb.firstChild);b.onclick=()=>editFeatureModal(U.sel);}}
  else if(U.tool==='analyze'&&!document.getElementById('uc')){const w=W(),uc=document.createElement('div');uc.id='uc';const l=uniqueCutters(w.seq,w.topology==='circular');uc.innerHTML='<h3 style="margin-top:20px">Unique cutters</h3>'+(l.length?l.map(x=>`<span class="echip" style="cursor:default">${x.enz}</span>`).join(' '):'<div class="mini">None in the enzyme set.</div>');tb.appendChild(uc);if(U.sel>=0&&w.features[U.sel]&&w.features[U.sel].type==='CDS'){let s=w.seq.slice(w.features[U.sel].start-1,w.features[U.sel].end);if(w.features[U.sel].strand===-1)s=rc(s);const ps=proteinStats(translate(s)),d=document.createElement('div');d.innerHTML=`<h3 style="margin-top:20px">Protein stats</h3><div class="li">${ps.len} aa · MW ~${(ps.mw/1000).toFixed(1)} kDa · net charge ${ps.charge} · pI ~${ps.pI}</div>`;tb.appendChild(d);}}
  else if(U.tool==='align'&&!document.getElementById('msaB')){const d=document.createElement('div');d.innerHTML='<h3 style="margin-top:20px">Multiple sequence alignment</h3><div class="mini" style="margin-bottom:6px">Paste extra sequences (one per line); current seq is the reference. Progressive star alignment (approximate).</div><textarea id="msaIn" placeholder="seq B&#10;seq C"></textarea><button class="btn sm primary" id="msaB" style="width:100%;margin-top:8px">Align all</button><div id="msaO" style="margin-top:10px"></div>';tb.appendChild(d);document.getElementById('msaB').onclick=()=>{const r=msaAlign([W().seq,...document.getElementById('msaIn').value.split(/\n+/).map(clean).filter(Boolean)]);if(!r){flash('Need ≥2 sequences');return;}document.getElementById('msaO').innerHTML='<div class="out">'+r.rows.map((row,i)=>`<div class="alnrow">${i===0?'(ref) ':'      '}${row.slice(0,120)}${row.length>120?'…':''}</div>`).join('')+'</div>';};}
  else if(U.tool==='builder'){[...tb.querySelectorAll('.frow')].forEach((r,i)=>{r.setAttribute('draggable','true');r.style.cursor='grab';r.ondragstart=e=>e.dataTransfer.setData('i',i);r.ondragover=e=>e.preventDefault();r.ondrop=e=>{e.preventDefault();const f=+e.dataTransfer.getData('i');if(f===i||isNaN(f))return;const it=U.build.splice(f,1)[0];U.build.splice(i,0,it);renderTool();};});}}

function crisprGuides(seq){const out=[];const scan=(s,strand)=>{for(let i=0;i+23<=s.length;i++){const pam=s.substr(i+20,3);if(pam[1]==='G'&&pam[2]==='G'){const guide=s.substr(i,20);out.push({guide,pam,strand,pos:strand>0?i+1:seq.length-(i+23)+1,gc:gc(guide)});}}};scan(seq,1);scan(rc(seq),-1);return out;}

function simpleHash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(16).padStart(8,'0');}

function openPalette(){const cmds=paletteCommands();let sel=0;const wrap=document.createElement('div');wrap.id='pal';wrap.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10000;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh';wrap.innerHTML='<div style="width:520px;max-width:92%;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden"><input id="palIn" placeholder="Type a command…  (Esc to close)" style="border:none;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:15px"><div id="palList" style="max-height:340px;overflow:auto"></div></div>';document.body.appendChild(wrap);const inp=wrap.querySelector('#palIn'),list=wrap.querySelector('#palList');const close=()=>wrap.remove();const filt=()=>cmds.filter(c=>c[0].toLowerCase().includes(inp.value.toLowerCase()));const draw=()=>{const f=filt();if(sel>=f.length)sel=0;list.innerHTML=f.map((c,i)=>`<div class="palitem" data-i="${i}" style="padding:10px 16px;font-size:14px;cursor:pointer;background:${i===sel?'var(--aw)':'transparent'};color:${i===sel?'var(--aink)':'var(--ink)'}">${c[0]}</div>`).join('')||'<div style="padding:14px 16px;color:var(--muted)">No commands</div>';list.querySelectorAll('.palitem').forEach(el=>{el.onmouseenter=()=>{sel=+el.dataset.i;draw();};el.onclick=()=>{const f2=filt();close();f2[+el.dataset.i][1]();};});};inp.oninput=()=>{sel=0;draw();};inp.onkeydown=e=>{const f=filt();if(e.key==='ArrowDown'){sel=Math.min(f.length-1,sel+1);draw();e.preventDefault();}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault();}else if(e.key==='Enter'){if(f[sel]){close();f[sel][1]();}}else if(e.key==='Escape')close();};wrap.onclick=e=>{if(e.target===wrap)close();};draw();setTimeout(()=>inp.focus(),30);}
