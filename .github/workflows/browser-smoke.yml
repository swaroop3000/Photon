name: Photon browser smoke tests

on:
  pull_request:
  push:
    branches:
      - feature/photon-1-core-engine

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Photon static server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/photon-server.log 2>&1 &
      - name: Run browser smoke tests
        run: node --test browser/*.test.mjs
