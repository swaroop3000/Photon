name: DNA core tests

on:
  push:
    branches:
      - main
      - feature/photon-1-core-engine
  pull_request:

permissions:
  contents: read

jobs:
  dna-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run DNA core tests
        run: npm test
